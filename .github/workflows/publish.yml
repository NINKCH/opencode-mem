name: Publish to npm

# Publishes @ninkch/opencode-mem to npm using OIDC Trusted Publishing
# (no NPM_TOKEN secret required once the Trusted Publisher connection
# is configured on npmjs.com with these values):
#   Organization or user: NINKCH
#   Repository:           opencode-mem
#   Workflow filename:    publish.yml
#   Environment name:     (leave empty, or set to "npm" and add it below)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
